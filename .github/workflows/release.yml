# Construction d'une version de Nevermind sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature
# Authenticode gratuite par SignPath Foundation (même modèle que Mindset, issue #4 de Mindset).
#
# Déroulé :
#   1. « construire » : compile Nevermind.exe, « Désinstaller Nevermind.exe » et NevermindAide.exe
#      (outils\construire.ps1) et dépose le dossier OptiGame comme artefact.
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose OptiGame.zip (signé) comme artefact.
#   3. Sur le PC de Jordan : outils\publier.ps1 récupère ce OptiGame.zip, fait sa signature RSA (OptiGame.zip.sig,
#      clé privée qui ne quitte jamais le PC) et crée la Release. Ce workflow ne publie rien.
#
# Le zip et son dossier gardent le nom « OptiGame » : les versions déjà installées cherchent ce nom.
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  construire:
    name: "Construire Nevermind"
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      - name: "Récupérer le code"
        uses: actions/checkout@v4

      - name: "Numéro de version"
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = [IO.File]::ReadAllText('OptiGame\fichiers\OptiGame.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans OptiGame.ps1' }
          $v = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version de OptiGame.ps1 ($v)."
          }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version4=$v4`n")
          Write-Host "Version $v ($v4)"

      - name: "Construire (outils\\construire.ps1)"
        run: |
          $ErrorActionPreference = 'Stop'
          .\outils\construire.ps1

      - name: "Vérifier les trois exe"
        run: |
          $ErrorActionPreference = 'Stop'
          # Les exe à la racine du dossier : Nevermind.exe, Désinstaller Nevermind.exe, NevermindAide.exe
          # (cherchés par motif : un nom accentué écrit ici pourrait mal passer dans le script de l'étape)
          $exes = @(Get-ChildItem -LiteralPath 'OptiGame' -Filter '*.exe' -File)
          if ($exes.Count -ne 3) { throw "3 exe attendus dans OptiGame, trouvés : $($exes.Name -join ', ')" }
          foreach ($exe in $exes) {
            $n = $exe.Name
            $i = $exe.VersionInfo
            Write-Host "$n : produit $($i.ProductName), version du produit $($i.ProductVersion)"
            if ($i.ProductName -ne 'Nevermind') { throw "Nom de produit inattendu pour $n : $($i.ProductName)" }
            if ($i.ProductVersion -ne '${{ steps.version.outputs.version4 }}') {
              Write-Host "::warning::La version de $n ($($i.ProductVersion)) n'est pas ${{ steps.version.outputs.version4 }} : lanceur.cs n'a pas été mis à jour par publier.ps1."
            }
            $h = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$n (non signé) : SHA-256 ``$h``" + "`n")
          }

      - name: "Préparer le dossier à signer"
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath 'OptiGame' -Destination $dest -Recurse
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « OptiGame » (les trois exe, LISEZMOI.txt, fichiers\...).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@v7
        with:
          name: Nevermind-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

  signer:
    name: "Signer avec SignPath"
    needs: construire
    if: ${{ vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      # Sans artifact-configuration-slug, SignPath prend la configuration d'artefact par défaut du projet.
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Nevermind' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\OptiGame'
          if (-not (Test-Path -LiteralPath "$racine\Nevermind.exe")) { throw "Dossier signé inattendu : $racine\Nevermind.exe absent" }
          $problemes = @()
          $exes = @(Get-ChildItem -LiteralPath $racine -Filter '*.exe' -File)
          if ($exes.Count -ne 3) { throw "3 exe attendus dans $racine, trouvés : $($exes.Name -join ', ')" }
          $nos = $exes + @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Les fichiers d'autres auteurs gardent leur propre signature (jamais signés par nous)
          $tiers = @(
            @("$racine\fichiers\lib\webview2\Microsoft.Web.WebView2.Core.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\lib\webview2\Microsoft.Web.WebView2.Wpf.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\lib\webview2\WebView2Loader.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\outils-tiers\PresentMon.exe", 'Intel Corporation')
          )
          foreach ($t in $tiers) {
            $s = Get-AuthenticodeSignature -LiteralPath $t[0]
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch "CN=$([regex]::Escape($t[1]))(,|$)") { $problemes += "$($t[0]) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation, fichiers de Microsoft et d'Intel intacts."

      - name: "Construire OptiGame.zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
          $zip = '_ci\sortie\OptiGame.zip'
          Compress-Archive -Path '_ci\signe\OptiGame' -DestinationPath $zip -Force
          $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$h  OptiGame.zip" | Out-File -FilePath '_ci\sortie\OptiGame.zip.sha256' -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "OptiGame.zip (signé par SignPath) : SHA-256 ``$h``" + "`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release)
      - name: "Déposer OptiGame.zip signé"
        uses: actions/upload-artifact@v7
        with:
          name: Nevermind-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
