# Construction d'une version de Nevermind sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature
# Authenticode gratuite par SignPath Foundation (même modèle que Mindset, issue #4 de Mindset).
#
# Déroulé :
#   1. « construire » : compile Mindset.exe, Nevermind.exe (relais), « Désinstaller Nevermind.exe » et NevermindAide.exe
#      (outils\construire.ps1) et dépose le dossier Nevermind comme artefact.
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose le zip (signé) comme artefact : Nevermind.zip (outils\zips.ps1).
#   3. Sur le PC de Jordan : outils\publier.ps1 récupère ce zip, fait sa signature RSA (<zip>.sig, clé privée qui ne
#      quitte jamais le PC) et crée la Release. Ce workflow ne publie rien.
#   0. « rust » (passage en Rust, étape 1a), seulement si rust\nevermind-aide existe : construit NevermindAide.exe en Rust
#      (cargo build --release --locked), l'atteste (attestation GitHub : ce dépôt, ce fichier de construction, ce
#      commit) et le dépose comme artefact « NevermindAide-rust ». « construire » le met à la place de celui du lanceur
#      C#, et outils\publier.ps1 (outils\aide-rust.ps1) le récupère et vérifie son attestation avant de signer les zips.
#      Sans rust\nevermind-aide, ce job ne fait rien et le reste est inchangé.
#
# Nevermind en Rust (tout Nevermind en Rust, rust\nevermind-appli ; contenu du zip : outils\contenu-rust.ps1). Deux sortes
# de versions (« genre », décidé par le job « genre ») :
#   - powershell (la version d'aujourd'hui) : tag v<version de Nevermind.ps1>, ou lancement à la main avec
#     genre = powershell (par défaut). Tout ce qui est décrit plus haut, inchangé ;
#   - rust : lancement à la main avec genre = rust (c'est ce que fait outils\publier.ps1 -Rust avant de publier), ou tag
#     v<version> quand Nevermind.ps1 et rust\nevermind-appli\Cargo.toml ont tous deux cette version (seul
#     outils\version-rust.ps1 les aligne ; une publication PowerShell n'écrit que Nevermind.ps1). Le job
#     « Nevermind en Rust » vérifie les règles Tauri de la suite (verifier-tauri.ps1 du dépôt Mindset, épinglé), passe
#     cargo deny, construit (outils\construire-rust.ps1 : cargo build --release --locked, jamais l'option « essai »), fait
#     Nevermind.zip (outils\zip-rust.ps1, vérifié par outils\verifier-zip-rust.ps1 : fichiers exacts, version.json, fiches
#     de version, aucune construction d'essai, aucun runtime C à part), l'atteste (ce dépôt, ce fichier, ce commit) et le
#     dépose comme artefact « Nevermind-rust-zip ». outils\publier.ps1 -Rust le récupère et vérifie son attestation
#     avant de le signer (outils\zip-rust-github.ps1). « construire » prend alors le dossier de ce zip tel quel comme
#     dossier à signer, sans rien construire en PowerShell.
#
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      genre:
        description: "Quel Nevermind construire : powershell (la version publiée) ou rust (Nevermind en Rust)"
        type: choice
        options:
          - powershell
          - rust
        default: powershell

permissions:
  contents: read
  actions: read

jobs:
  genre:
    name: "Genre de la version (PowerShell ou Rust)"
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      GENRE_DEMANDE: ${{ inputs.genre }}
    outputs:
      genre: ${{ steps.genre.outputs.genre }}
      version: ${{ steps.genre.outputs.version }}
    steps:
      - name: "Récupérer le code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "PowerShell ou Rust ? (genre demandé, ou tag : v<version> de Nevermind.ps1 et de rust/nevermind-appli/Cargo.toml)"
        id: genre
        run: |
          $ErrorActionPreference = 'Stop'
          . .\outils\contenu-rust.ps1
          $racine = (Get-Location).Path
          $vrust = Get-VersionNevermindRust $racine
          $vps = Get-VersionNevermindPs $racine
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $genre = if ($vrust -and $vps -ceq $vrust -and $env:GITHUB_REF_NAME -ceq "v$vrust") { 'rust' } else { 'powershell' }
          } else { $genre = if ($env:GENRE_DEMANDE -eq 'rust') { 'rust' } else { 'powershell' } }
          if ($genre -eq 'rust' -and $vrust -notmatch '^\d+(\.\d+){1,3}$') { throw "Nevermind en Rust demandé, mais la version de rust\nevermind-appli\Cargo.toml est introuvable ou mal écrite ($vrust)." }
          $version = if ($genre -eq 'rust') { $vrust } else { $vps }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "genre=$genre`nversion=$version`n")
          Write-Host "Genre : $genre (Nevermind.ps1 : $vps ; nevermind-appli : $vrust)"

  rust:
    name: "Programmes en Rust (NevermindAide.exe, NevermindPont.dll ; seulement si rust\\nevermind-aide ou rust\\nevermind-pont existe)"
    needs: genre
    # (version PowerShell seulement ; Nevermind en Rust : le job « Nevermind en Rust » plus bas)
    if: ${{ needs.genre.outputs.genre == 'powershell' }}
    runs-on: windows-latest
    # (le jeton OIDC et l'écriture d'attestations : seulement pour ce job)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      CARGO_TERM_COLOR: never
    outputs:
      present: ${{ steps.rust.outputs.present }}
    steps:
      - name: "Récupérer le code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Y a-t-il des programmes en Rust ? (rust/nevermind-aide, rust/nevermind-pont)"
        id: rust
        run: |
          $aide = Test-Path -LiteralPath 'rust\nevermind-aide\Cargo.toml'
          $pont = Test-Path -LiteralPath 'rust\nevermind-pont\Cargo.toml'
          $present = $aide -or $pont
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "present=$($present.ToString().ToLower())`naide=$($aide.ToString().ToLower())`npont=$($pont.ToString().ToLower())`n")
          Write-Host "NevermindAide.exe en Rust : $aide ; NevermindPont.dll : $pont"

      - name: "Rust, la version figée par rust/rust-toolchain.toml"
        if: ${{ steps.rust.outputs.present == 'true' }}
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version

      - name: "Construire NevermindAide.exe (cargo build --release --locked)"
        if: ${{ steps.rust.outputs.aide == 'true' }}
        working-directory: rust
        run: |
          cargo build --release --locked -p nevermind-aide
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force -Path ..\_ci\rust | Out-Null
          # (le binaire s'appelle NevermindAide, celui du crate nevermind-aide)
          $exe = @('target\release\NevermindAide.exe', 'target\release\nevermind-aide.exe' | Where-Object { Test-Path -LiteralPath $_ })[0]
          if (-not $exe) { Write-Host 'NevermindAide.exe introuvable dans target\release'; exit 1 }
          Copy-Item -LiteralPath $exe -Destination ..\_ci\rust\NevermindAide.exe

      - name: "Construire NevermindPont.dll (outils/construire-pont.ps1, runtime C dedans)"
        if: ${{ steps.rust.outputs.pont == 'true' }}
        run: |
          $dll = @(& .\outils\construire-pont.ps1)[-1]
          if (-not (Test-Path -LiteralPath $dll)) { exit 1 }
          New-Item -ItemType Directory -Force -Path _ci\rust | Out-Null
          Copy-Item -LiteralPath $dll -Destination _ci\rust\NevermindPont.dll

      - name: "Aucun runtime C à part (VCRUNTIME*.dll, MSVCP*.dll), sinon refusé"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          .\outils\verifier-imports.ps1 -Liste -Fichiers @(Get-ChildItem -LiteralPath _ci\rust -File | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE) { exit 1 }
          foreach ($f in Get-ChildItem -LiteralPath _ci\rust -File) {
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($f.Name) (Rust, non signé) : SHA-256 ``$((Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash)``" + "`n")
          }

      # L'attestation que outils\publier.ps1 vérifie (outils\aide-rust.ps1 : gh attestation verify --repo
      # JordanJacquot/Nevermind --signer-workflow JordanJacquot/Nevermind/.github/workflows/release.yml --source-digest <commit>)
      - name: "Attester les programmes en Rust (ce dépôt, ce fichier de construction, ce commit)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/rust/*

      - name: "Déposer les programmes en Rust"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nevermind-rust
          path: _ci/rust/
          if-no-files-found: error
          retention-days: 30

  nevermind-rust:
    name: "Nevermind en Rust (seulement pour une version en Rust)"
    needs: genre
    if: ${{ needs.genre.outputs.genre == 'rust' }}
    runs-on: windows-latest
    # (le jeton OIDC et l'écriture d'attestations : seulement pour ce job)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      CARGO_TERM_COLOR: never
    steps:
      # Les fichiers tels qu'ils sont dans git : sans ça, git pour Windows change les fins de ligne en CRLF, et les
      # fichiers copiés dans le zip (LISEZMOI...) ne sont plus ceux du commit (leçon de Mindcare, publication du 04/11)
      - name: "Garder les fins de ligne de git"
        run: git config --global core.autocrlf false

      - name: "Récupérer le code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml"
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Récupérer les règles Tauri de la suite (dépôt Mindset, commit épinglé : outils\\verifier-tauri.ps1)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          # (le même commit que dans tests.yml : Mindset 2.18.0)
          ref: cf032708ef430c6f988f0f72b1fcc9bf68c3c598
          path: _mindset
          persist-credentials: false

      - name: "Règles Tauri de la suite (verifier-tauri.ps1 sur rust\\nevermind-appli)"
        working-directory: rust
        run: |
          & ..\_mindset\outils\verifier-tauri.ps1 -Projet nevermind-appli
          exit $LASTEXITCODE

      - name: "cargo deny : licences compatibles MIT, failles connues, liste blanche des bibliothèques (Tauri compris), plugins interdits"
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cargo-deny 0.20.2 tout prêt, vérifié par son empreinte (la même que dans tests.yml et dans Mindset)
          $d = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          $archive = Join-Path $d 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $h = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($h -ne '975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC') { Write-Host "Empreinte inattendue : $h"; exit 1 }
          tar -xzf $archive -C $d
          $exe = Get-ChildItem -LiteralPath $d -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --locked check
          if ($LASTEXITCODE) { exit 1 }

      # Construction de publication : cargo build --release --locked, sans l'option « essai » (outils\construire-rust.ps1,
      # le même que dans tests.yml)
      - name: "Construire Nevermind en Rust (outils\\construire-rust.ps1 : Mindset.exe, Nevermind.exe, NevermindAide.exe, le désinstalleur, version.json, LISEZMOI.txt, PresentMon)"
        run: |
          & .\outils\construire-rust.ps1 -Sortie '_ci\rust'
          if (-not $?) { exit 1 }

      # Sans -Ci : tout doit être à la version de version.json, NevermindAide.exe compris (outils\version-rust.ps1)
      - name: "Nevermind.zip (outils\\zip-rust.ps1) et ses contrôles : fichiers exacts, version.json, fiches de version, aucune construction d'essai, aucun runtime C à part"
        run: |
          & .\outils\zip-rust.ps1 -Dossier '_ci\rust\Nevermind' -Zip '_ci\rust-zip\Nevermind.zip'
          if ($LASTEXITCODE) { exit 1 }
          $h = (Get-FileHash -LiteralPath '_ci\rust-zip\Nevermind.zip' -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Nevermind.zip (Rust ${{ needs.genre.outputs.version }}, non signé, commit $env:GITHUB_SHA) : SHA-256 ``$h``" + "`n")
          foreach ($e in Get-ChildItem -LiteralPath '_ci\rust\Nevermind' -Filter '*.exe' -File) {
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($e.Name) (Rust) : SHA-256 ``$((Get-FileHash -LiteralPath $e.FullName -Algorithm SHA256).Hash)``" + "`n")
          }

      # L'attestation que outils\publier.ps1 -Rust vérifie (outils\zip-rust-github.ps1 : gh attestation verify
      # --repo JordanJacquot/Nevermind --signer-workflow JordanJacquot/Nevermind/.github/workflows/release.yml
      # --source-digest <commit>)
      - name: "Attester Nevermind.zip (ce dépôt, ce fichier de construction, ce commit)"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/rust-zip/Nevermind.zip

      - name: "Déposer Nevermind.zip (Rust)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nevermind-rust-zip
          path: _ci/rust-zip/
          if-no-files-found: error
          retention-days: 30

  construire:
    name: "Construire Nevermind"
    needs: [genre, rust, nevermind-rust]
    # (un des deux jobs de programmes est sauté selon le genre : celui qui a tourné doit avoir réussi)
    if: ${{ !cancelled() && needs.genre.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      genre: ${{ needs.genre.outputs.genre }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      - name: "Récupérer le code"
        uses: actions/checkout@v4

      - name: "Numéro de version"
        id: version
        env:
          GENRE: ${{ needs.genre.outputs.genre }}
          VERSION_RUST: ${{ needs.genre.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = [IO.File]::ReadAllText('Nevermind\fichiers\Nevermind.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans Nevermind.ps1' }
          $v = $Matches[1]
          # (Nevermind en Rust : la version de rust\nevermind-appli\Cargo.toml, donnée par le job « genre »)
          if ($env:GENRE -eq 'rust') { $v = $env:VERSION_RUST }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version de Nevermind.ps1 ($v)."
          }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version4=$v4`n")
          Write-Host "Version $v ($v4)"

      - name: "Construire (outils\\construire.ps1)"
        if: ${{ needs.genre.outputs.genre == 'powershell' }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\outils\construire.ps1

      - name: "Récupérer les programmes en Rust (job rust de ce run)"
        if: ${{ needs.genre.outputs.genre == 'powershell' && needs.rust.outputs.present == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Nevermind-rust
          path: _ci/rust

      - name: "Les programmes en Rust dans le dossier (NevermindAide.exe à la place du lanceur C#, NevermindPont.dll)"
        if: ${{ needs.genre.outputs.genre == 'powershell' && needs.rust.outputs.present == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem -LiteralPath '_ci\rust' -File) {
            Copy-Item -LiteralPath $f.FullName -Destination (Join-Path 'Nevermind' $f.Name) -Force
            Write-Host "$($f.Name) : Rust, SHA-256 $((Get-FileHash -LiteralPath (Join-Path 'Nevermind' $f.Name) -Algorithm SHA256).Hash)"
          }

      - name: "Vérifier les quatre exe (et NevermindPont.dll)"
        if: ${{ needs.genre.outputs.genre == 'powershell' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Les exe à la racine du dossier : Mindset.exe (le programme qui fait tourner Nevermind), Nevermind.exe (relais),
          # Désinstaller Nevermind.exe, NevermindAide.exe ; et NevermindPont.dll avec rust\nevermind-pont
          # (cherchés par motif : un nom accentué écrit ici pourrait mal passer dans le script de l'étape)
          $exes = @(Get-ChildItem -LiteralPath 'Nevermind' -Filter '*.exe' -File)
          if ($exes.Count -ne 4) { throw "4 exe attendus dans Nevermind, trouvés : $($exes.Name -join ', ')" }
          $dlls = @(Get-ChildItem -LiteralPath 'Nevermind' -Filter '*.dll' -File)
          $pont = Test-Path -LiteralPath 'rust\nevermind-pont\Cargo.toml'
          if ((@($dlls | ForEach-Object { $_.Name }) -join ',') -ne $(if ($pont) { 'NevermindPont.dll' } else { '' })) { throw "DLL inattendues dans Nevermind : $(@($dlls | ForEach-Object { $_.Name }) -join ', ')" }
          foreach ($exe in $exes + $dlls) {
            $n = $exe.Name
            $i = $exe.VersionInfo
            Write-Host "$n : produit $($i.ProductName), version du produit $($i.ProductVersion)"
            if ($i.ProductName -ne 'Nevermind') { throw "Nom de produit inattendu pour $n : $($i.ProductName)" }
            if ($i.ProductVersion -ne '${{ steps.version.outputs.version4 }}') {
              Write-Host "::warning::La version de $n ($($i.ProductVersion)) n'est pas ${{ steps.version.outputs.version4 }} : construire.ps1 la prend dans Nevermind.ps1."
            }
            $h = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$n (non signé) : SHA-256 ``$h``" + "`n")
          }
          # Aucun programme livré ne doit avoir besoin d'un runtime C à installer à part (VCRUNTIME)
          .\outils\verifier-imports.ps1 -Fichiers @(($exes + $dlls) | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE) { exit 1 }

      - name: "Préparer le dossier à signer"
        if: ${{ needs.genre.outputs.genre == 'powershell' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath 'Nevermind' -Destination $dest -Recurse
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      - name: "Récupérer Nevermind.zip en Rust (job « Nevermind en Rust » de ce run)"
        if: ${{ needs.genre.outputs.genre == 'rust' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Nevermind-rust-zip
          path: _ci/rust-zip

      # Nevermind en Rust : le dossier Nevermind du zip attesté, tel quel (rien n'est construit en PowerShell)
      - name: "Préparer le dossier à signer (Nevermind en Rust)"
        if: ${{ needs.genre.outputs.genre == 'rust' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath '_ci\rust-zip\Nevermind.zip' -DestinationPath $dest
          if (-not (Test-Path -LiteralPath "$dest\Nevermind\Nevermind.exe")) { throw "Dossier à signer inattendu : $dest\Nevermind\Nevermind.exe absent" }
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « Nevermind » (les quatre exe, NevermindPont.dll s'il y a lieu, LISEZMOI.txt, fichiers\...).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@v7
        with:
          name: Nevermind-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

  signer:
    name: "Signer avec SignPath"
    needs: construire
    # (!cancelled() : le job de programmes sauté selon le genre ne doit pas sauter celui-ci)
    if: ${{ !cancelled() && needs.construire.result == 'success' && vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      # (seulement pour outils\zips.ps1, qui fait le zip depuis le dossier signé)
      - name: "Récupérer le code"
        uses: actions/checkout@v4

      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      # Sans artifact-configuration-slug, SignPath prend la configuration d'artefact par défaut du projet.
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Nevermind' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\Nevermind'
          $rust = '${{ needs.construire.outputs.genre }}' -eq 'rust'
          if (-not (Test-Path -LiteralPath "$racine\Nevermind.exe")) { throw "Dossier signé inattendu : $racine\Nevermind.exe absent" }
          $problemes = @()
          $exes = @(Get-ChildItem -LiteralPath $racine -Filter '*.exe' -File)
          if ($exes.Count -ne 4) { throw "4 exe attendus dans $racine, trouvés : $($exes.Name -join ', ')" }
          # (et NevermindPont.dll, la DLL en Rust de Nevermind, avec rust\nevermind-pont : signée comme les exe)
          $nos = $exes + @(Get-ChildItem -LiteralPath $racine -Filter 'NevermindPont.dll' -File) + @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Les fichiers d'autres auteurs gardent leur propre signature (jamais signés par nous)
          # (Nevermind en Rust : seulement PresentMon, plus les bibliothèques WebView2 de WPF)
          $tiers = if ($rust) { @(,@("$racine\fichiers\outils-tiers\PresentMon.exe", 'Intel Corporation')) } else { @(
            @("$racine\fichiers\lib\webview2\Microsoft.Web.WebView2.Core.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\lib\webview2\Microsoft.Web.WebView2.Wpf.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\lib\webview2\WebView2Loader.dll", 'Microsoft Corporation'),
            @("$racine\fichiers\outils-tiers\PresentMon.exe", 'Intel Corporation')
          ) }
          foreach ($t in $tiers) {
            $s = Get-AuthenticodeSignature -LiteralPath $t[0]
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch "CN=$([regex]::Escape($t[1]))(,|$)") { $problemes += "$($t[0]) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation, fichiers de Microsoft et d'Intel intacts."

      - name: "Construire le zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          # (Nevermind en Rust : le dossier signé zippé tel quel, comme outils\zip-rust.ps1 ; sinon outils\zips.ps1)
          if ('${{ needs.construire.outputs.genre }}' -eq 'rust') {
            New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
            Compress-Archive -LiteralPath '_ci\signe\Nevermind' -DestinationPath '_ci\sortie\Nevermind.zip' -Force
            $zips = @('_ci\sortie\Nevermind.zip')
          } else { $zips = @(.\outils\zips.ps1 -Dossier '_ci\signe\Nevermind' -Sortie '_ci\sortie') }
          foreach ($zip in $zips) {
            $n = Split-Path $zip -Leaf
            $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            "$h  $n" | Out-File -FilePath "$zip.sha256" -Encoding ascii
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$n (signé par SignPath) : SHA-256 ``$h``" + "`n")
          }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release)
      - name: "Déposer les zips signés"
        uses: actions/upload-artifact@v7
        with:
          name: Nevermind-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
