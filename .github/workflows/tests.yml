# Vérifications automatiques à chaque envoi (push) et à chaque demande de fusion (pull request).
# Tout tourne dans Windows PowerShell 5.1, comme l'appli. Pas de fenêtre, rien n'est installé ni modifié sur le PC.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # (contre-épreuves : l'ancien code est relu dans git)

      - name: Analyse du code (PSScriptAnalyzer, erreurs seulement)
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $resultats = @(Invoke-ScriptAnalyzer -Path Nevermind -Recurse -Severity Error)
          $resultats | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($resultats.Count) { Write-Host "$($resultats.Count) erreur(s) trouvée(s) par PSScriptAnalyzer."; exit 1 }
          Write-Host 'Aucune erreur trouvée par PSScriptAnalyzer.'

      # (passage en Rust, étape 1a : la version de Nevermind qui se sert de NevermindPont.dll, et ses tests, en ont besoin ;
      # sans rust/nevermind-pont, rien à faire)
      - name: "NevermindPont.dll construite (outils/construire-pont.ps1, si rust/nevermind-pont existe)"
        run: |
          if (-not (Test-Path -LiteralPath 'rust\nevermind-pont\Cargo.toml')) { Write-Host 'Pas de rust\nevermind-pont : rien à construire.'; exit 0 }
          Push-Location rust; rustup toolchain install; $code = $LASTEXITCODE; Pop-Location
          if ($code) { exit 1 }
          $dll = @(& .\outils\construire-pont.ps1)[-1]
          if (-not (Test-Path -LiteralPath $dll)) { exit 1 }
          .\outils\verifier-imports.ps1 -Fichiers $dll
          exit $LASTEXITCODE

      - name: Vérifications du dépôt (syntaxe, fenêtre, tirets, encodage, licence)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\verifier.ps1
          exit $LASTEXITCODE

      - name: "Changement de nom (ancien nom seulement là où il sert, lanceur et verrou compatibles, plus de zip de compatibilité, mises à jour)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-renommage.ps1
          exit $LASTEXITCODE

      - name: "Tests de l'Aide administrateur (mode vérification, rien n'est modifié ; fermer seulement un programme du compte et de la session)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide.ps1
          exit $LASTEXITCODE

      - name: "Aide face à un environnement piégé (faux modules PowerShell, faux dossiers de Windows, canal limité à 64 Ko et 5 s)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide-environnement.ps1
          exit $LASTEXITCODE

      - name: "Aide en SYSTEM (seulement la tâche SYSTEM de l'utilisateur, sinon la demande de Windows ; canal, aide-temp, aucune fenêtre ; résultat inconnu si Defender n'est pas lu)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide-systeme.ps1
          exit $LASTEXITCODE

      - name: "Déclarations des corrections (valeurs montrées avant confirmation, faux registre)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-declarations.ps1
          exit $LASTEXITCODE

      - name: "Contrôle de PresentMon (signature Intel, rien n'est lancé)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-presentmon.ps1
          exit $LASTEXITCODE

      - name: "Désinstalleur (choix des données, faux dossier, rien n'est supprimé sur le PC)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-desinstallation.ps1
          exit $LASTEXITCODE

      - name: "Données jamais perdues (fichier abîmé, copie de secours, « Tout restaurer » avec une Aide muette)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-donnees.ps1
          exit $LASTEXITCODE

      - name: "Page RAM (regroupement par appli, étiquettes, alertes, rapport, fausses données)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-memoire.ps1
          exit $LASTEXITCODE

      - name: "Restes de jeux Steam (bibliothèque au nom accentué, fiche verrouillée, fiches relues avant de supprimer, rien de récent supprimé, fausse bibliothèque)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-bibliotheque.ps1
          exit $LASTEXITCODE

      - name: "Sécurité (tâches pas désactivées dites comme telles, jamais « Aucune menace » sans résultat lu, fausses commandes)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-securite.ps1
          exit $LASTEXITCODE

      - name: "Fluidité en partie (écoute de la souris sur son propre fil, Aide qui tient quand ses connexions sont prises, minuteurs qui ne s'empilent plus)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-fluidite.ps1
          exit $LASTEXITCODE

      - name: "Réseau (anciens serveurs plus pingés, box des autres joueurs écartées, suite Mindset non suspecte, trace en veille seulement avec BF6, petits textes)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-reseau.ps1
          exit $LASTEXITCODE

      - name: "Mesure des FPS (jeux à anti-triche EA guettés avant leur lancement, message clair, compteur caché en plein écran exclusif, bulles une à une, longues parties)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-fps.ps1
          exit $LASTEXITCODE

      - name: "Panneau et fiche de l'écran (détail du trafic et « Ce que Windows envoie à Microsoft » rouverts après un départ par un onglet)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-panneau.ps1
          exit $LASTEXITCODE

      - name: "Thème (copie gérée par Mindset : aucun choix, renvoi vers Mindset, suite.json jamais écrit ; copie autonome : choix et import)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-theme.ps1
          exit $LASTEXITCODE

      - name: "NevermindPont.dll vue depuis Nevermind (outils/tester-pont.ps1, s'il existe : corpus, DLL absente ou abîmée, erreur Rust rattrapée)"
        run: |
          if (-not (Test-Path -LiteralPath 'outils\tester-pont.ps1')) { Write-Host 'Pas de tester-pont.ps1 : rien à faire.'; exit 0 }
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-pont.ps1
          exit $LASTEXITCODE

  # Le Rust de Nevermind (passage en Rust, étape 1a : NevermindAide.exe). Tant que rust\Cargo.toml n'existe pas, rien à
  # faire : le job reste vert.
  rust:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Y a-t-il du Rust ? (rust/Cargo.toml)"
        id: rust
        working-directory: .
        run: |
          $present = Test-Path -LiteralPath 'rust\Cargo.toml'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "present=$($present.ToString().ToLower())`n")
          Write-Host $(if ($present) { 'rust\Cargo.toml trouvé : construction et vérifications.' } else { 'Pas de rust\Cargo.toml : rien à construire.' })

      - name: "Rust, la version figée par rust/rust-toolchain.toml (avec clippy et rustfmt)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          rustc --version
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Construction (bibliothèques figées par Cargo.lock)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: cargo build --locked --workspace

      - name: "Programmes livrés (construction release) : aucun runtime C à part (VCRUNTIME*.dll, MSVCP*.dll)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          cargo build --release --locked --workspace
          if ($LASTEXITCODE) { exit 1 }
          # (les exe et DLL du dossier release : NevermindAide.exe, nevermind_pont.dll... ; pas les essais ni les dépendances)
          $livres = @(Get-ChildItem -LiteralPath target\release -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object { $_.FullName })
          if (-not $livres.Count) { Write-Host 'Aucun exe ni DLL construit.'; exit 0 }
          ..\outils\verifier-imports.ps1 -Liste -Fichiers $livres
          exit $LASTEXITCODE

      # Les juges ont été exportés de la version PowerShell à l'heure de Paris (dates des parties, du lag) : la machine
      # de GitHub est mise à la même heure, sinon les heures affichées diffèrent d'une ou deux heures
      - name: "Heure de Paris pour les juges"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: tzutil /s "Romance Standard Time"

      - name: "Tests Rust (cargo test)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: cargo test --locked --workspace

      # ------------------------------------------------------------------------------------------------------------
      # Nevermind en Rust livré (outils\contenu-rust.ps1) : construit comme pour une publication, vérifié, puis passé
      # au job « Contrat » (contrat de la suite avec le vrai Mindset, mise à jour depuis 1.15.6)
      # ------------------------------------------------------------------------------------------------------------
      - name: "Aucun plugin de Tauri interdit (shell, fs, updater, single-instance, global-shortcut)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          # (le shell powershell de GitHub arrête tout à la première erreur : cargo écrit ses messages sur stderr)
          $ErrorActionPreference = 'Continue'
          $interdits = 'tauri-plugin-shell', 'tauri-plugin-fs', 'tauri-plugin-updater', 'tauri-plugin-single-instance', 'tauri-plugin-global-shortcut'
          $lock = [IO.File]::ReadAllText((Join-Path (Get-Location) 'Cargo.lock'))
          $trouves = @()
          foreach ($p in $interdits) {
            # 1. le Cargo.lock (toutes les plateformes)
            if ($lock -match ('(?m)^name = "' + [regex]::Escape($p) + '"\r?$')) { $trouves += "$p (Cargo.lock)" }
            # 2. cargo tree -i : la bibliothèque ne doit être tirée par rien, sur aucune plateforme
            $sortie = (cmd /c "cargo tree --locked -i $p --target all -e all 2>&1") | Out-String
            if ($LASTEXITCODE -eq 0) { $trouves += "$p (cargo tree)" }
            elseif ($sortie -notmatch 'did not match any packages') { Write-Host $sortie; Write-Host "cargo tree n'a pas pu répondre pour $p."; exit 1 }
          }
          if ($trouves.Count) { Write-Host "Plugins interdits trouvés : $($trouves -join ', ')"; exit 1 }
          Write-Host 'Aucun plugin interdit.'
          # (sinon GitHub reprend le code de sortie du dernier cargo tree, qui échoue justement quand rien n'est trouvé)
          exit 0

      - name: "Récupérer les règles Tauri de la suite (dépôt Mindset, commit épinglé : outils\\verifier-tauri.ps1)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          # (Mindset 2.18.0 : canal d'essai par appli, dossier WebView2-Tauri effacé ; le même commit que release.yml
          # et que le job « Contrat »)
          ref: cf032708ef430c6f988f0f72b1fcc9bf68c3c598
          path: _mindset
          persist-credentials: false

      - name: "Règles Tauri de la suite (verifier-tauri.ps1 sur rust\\nevermind-appli : configuration, capabilities, CSP, plugins, outils de développement, WebView2)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          & ..\_mindset\outils\verifier-tauri.ps1 -Projet nevermind-appli
          exit $LASTEXITCODE

      - name: "Construction de publication et dossier de Nevermind en Rust (outils\\construire-rust.ps1)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          & ..\outils\construire-rust.ps1 -Sortie (Join-Path $env:RUNNER_TEMP 'nevermind-rust')
          if (-not $?) { exit 1 }

      # (-Ci : entre deux publications, NevermindAide.exe peut encore avoir la version de Nevermind.ps1 ; release.yml et
      # outils\publier.ps1 -Rust, eux, exigent la même version partout)
      - name: "Nevermind.zip en Rust et ses contrôles (outils\\zip-rust.ps1 : fichiers exacts, version.json, fiches de version, aucune construction d'essai, aucun runtime C à part)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          & ..\outils\zip-rust.ps1 -Dossier (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind') -Zip (Join-Path $env:RUNNER_TEMP 'nevermind-rust-zip\Nevermind.zip') -Ci
          exit $LASTEXITCODE

      - name: "Contre-épreuve : un zip avec un fichier en trop, ou un version.json faux, est refusé"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'contre-epreuve'
          $ok = $true
          foreach ($cas in 'en-trop', 'version') {
            if (Test-Path -LiteralPath $d) { Remove-Item -LiteralPath $d -Recurse -Force }
            Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind') -Destination (Join-Path $d 'Nevermind') -Recurse
            if ($cas -eq 'en-trop') { [IO.File]::WriteAllText((Join-Path $d 'Nevermind\fichiers\Nevermind.ps1'), '# un script en trop') }
            else { [IO.File]::WriteAllText((Join-Path $d 'Nevermind\version.json'), '{"appli":"nevermind","version":"0.0.1","mindset_min":"2.18.0"}') }
            Compress-Archive -LiteralPath (Join-Path $d 'Nevermind') -DestinationPath (Join-Path $d 'Nevermind.zip') -Force
            & ..\outils\verifier-zip-rust.ps1 -Zip (Join-Path $d 'Nevermind.zip') -Ci | Out-Host
            if ($LASTEXITCODE -ne 1) { Write-Host "Contre-épreuve « $cas » : le zip abîmé n'a pas été refusé."; $ok = $false }
          }
          if (-not $ok) { exit 1 }
          Write-Host 'Les deux zips abîmés sont refusés.'
          exit 0

      - name: "Déposer le dossier construit pour le job « Contrat »"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nevermind-rust-construit
          path: ${{ runner.temp }}/nevermind-rust/
          if-no-files-found: error
          retention-days: 3

      # La construction d'essai (option cargo « essai » de nevermind-appli), si elle existe : ses tests et clippy
      - name: "Tests et clippy de la construction d'essai (cargo test et clippy --features essai, si nevermind-appli a cette option)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $c = [IO.File]::ReadAllText((Join-Path (Get-Location) 'nevermind-appli\Cargo.toml'))
          if ($c -notmatch '(?ms)^\[features\][^\[]*^essai\s*=') { Write-Host 'nevermind-appli n''a pas d''option « essai » : rien à faire.'; exit 0 }
          cargo test --locked -p nevermind-appli --features essai
          if ($LASTEXITCODE) { exit 1 }
          cargo clippy --locked -p nevermind-appli --all-targets --features essai -- -D warnings
          if ($LASTEXITCODE) { exit 1 }
          exit 0

      - name: "Clippy strict (aucun avertissement permis)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: "Mise en forme (cargo fmt)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: cargo fmt --all --check

      - name: "cargo deny : licences compatibles MIT, failles connues, liste blanche des bibliothèques"
        if: ${{ steps.rust.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # cargo-deny 0.20.2 tout prêt, vérifié par son empreinte (relevée le 26/10/2026, comme Mindset), seulement sur la machine GitHub
          $d = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          gh release download 0.20.2 --repo EmbarkStudios/cargo-deny --pattern 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          $archive = Join-Path $d 'cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          $h = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($h -ne '975A22143262FD27476D19EE00C7AF67978426E40E1DEE94EED6BBADE1CF87DC') { Write-Host "Empreinte inattendue : $h"; exit 1 }
          tar -xzf $archive -C $d
          $exe = Get-ChildItem -LiteralPath $d -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName --locked check
          if ($LASTEXITCODE) { exit 1 }

  # Le contrat de la suite (docs\contrat-appli.md du dépôt Mindset) avec le VRAI code de Mindset, épinglé, sur Nevermind en
  # Rust construit par le job « rust » ; puis la mise à jour depuis la version PowerShell publiée (1.15.6), sans rien
  # perdre. Sur GitHub seulement : ces tests lancent Nevermind (caché) et son désinstalleur.
  contrat:
    name: "Contrat"
    needs: rust
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Récupérer le contrat de la suite (dépôt Mindset, commit épinglé : outils\\tester-contrat.ps1)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: JordanJacquot/Mindset
          # (Mindset 2.18.0, le même commit que le job « rust » et que release.yml)
          ref: cf032708ef430c6f988f0f72b1fcc9bf68c3c598
          path: _mindset
          persist-credentials: false

      - name: "Récupérer Nevermind en Rust construit (job rust)"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Nevermind-rust-construit
          path: ${{ runner.temp }}/nevermind-rust

      - name: "Contrat avec son entrée de demain (outils\\entree-apps-rust.json, type rust : apps.json, version.json, installation signée par une clé de test, verrou, Mindset.exe, -Demarrage, accrochage, taille minimale, afficher.demande, suite.json, WM_CLOSE, quitter.demande, désinstalleur)"
        run: |
          & .\_mindset\outils\tester-contrat.ps1 -AppliConstruite (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind') -EntreeApps .\outils\entree-apps-rust.json
          # (le code du test, jamais un code hérité d'une commande d'avant)
          if ($LASTEXITCODE -eq 0) { exit 0 }
          exit 1

      # L'entrée qu'ont les utilisateurs pendant la version d'essai : celle d'aujourd'hui (avec « script »), son type écrit
      # (le test le demande). Mindset reconnaît le dossier en Rust quand même (contrat-appli, partie 2).
      - name: "Contrat avec l'entrée d'aujourd'hui (outils\\entree-apps-bascule.json : celle d'apps.json, avec son script PowerShell)"
        run: |
          & .\_mindset\outils\tester-contrat.ps1 -AppliConstruite (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind') -EntreeApps .\outils\entree-apps-bascule.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          exit 1

      - name: "Mise à jour depuis 1.15.6 sans rien perdre (outils\\tester-maj-rust.ps1 : parametres.json, ignores.json, fichiers de l'utilisateur, même dossier de données)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'nevermind-1.15.6'
          gh release download v1.15.6 --repo JordanJacquot/Nevermind --pattern 'Nevermind.zip' --dir $d
          if ($LASTEXITCODE) { exit 1 }
          Write-Host "Nevermind.zip de 1.15.6 : SHA-256 $((Get-FileHash -LiteralPath (Join-Path $d 'Nevermind.zip') -Algorithm SHA256).Hash)"
          & .\outils\tester-maj-rust.ps1 -Ancienne (Join-Path $d 'Nevermind.zip') -Nouvelle (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind')
          if ($LASTEXITCODE -eq 0) { exit 0 }
          exit 1

      - name: "Désinstalleur en Rust pour de vrai (outils\\tester-desinstalleur-rust.ps1 : « tout optimiser », puis Désinstaller Nevermind.exe -GarderDonnees, -SupprimerDonnees, les deux options ; tout remis comme avant)"
        run: |
          & .\outils\tester-desinstalleur-rust.ps1 -Nouvelle (Join-Path $env:RUNNER_TEMP 'nevermind-rust\Nevermind')
          if ($LASTEXITCODE -eq 0) { exit 0 }
          exit 1
