# Vérifications automatiques à chaque envoi (push) et à chaque demande de fusion (pull request).
# Tout tourne dans Windows PowerShell 5.1, comme l'appli. Pas de fenêtre, rien n'est installé ni modifié sur le PC.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # (contre-épreuves : l'ancien code est relu dans git)

      - name: Analyse du code (PSScriptAnalyzer, erreurs seulement)
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $resultats = @(Invoke-ScriptAnalyzer -Path OptiGame -Recurse -Severity Error)
          $resultats | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($resultats.Count) { Write-Host "$($resultats.Count) erreur(s) trouvée(s) par PSScriptAnalyzer."; exit 1 }
          Write-Host 'Aucune erreur trouvée par PSScriptAnalyzer.'

      - name: Vérifications du dépôt (syntaxe, fenêtre, tirets, encodage, licence)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\verifier.ps1
          exit $LASTEXITCODE

      - name: "Tests de l'Aide administrateur (mode vérification, rien n'est modifié ; fermer seulement un programme du compte et de la session)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide.ps1
          exit $LASTEXITCODE

      - name: "Aide face à un environnement piégé (faux modules PowerShell, faux dossiers de Windows, canal limité à 64 Ko et 5 s)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide-environnement.ps1
          exit $LASTEXITCODE

      - name: "Aide en SYSTEM (seulement la tâche SYSTEM de l'utilisateur, sinon la demande de Windows ; canal, aide-temp, aucune fenêtre ; résultat inconnu si Defender n'est pas lu)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-aide-systeme.ps1
          exit $LASTEXITCODE

      - name: "Déclarations des corrections (valeurs montrées avant confirmation, faux registre)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-declarations.ps1
          exit $LASTEXITCODE

      - name: "Contrôle de PresentMon (signature Intel, rien n'est lancé)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-presentmon.ps1
          exit $LASTEXITCODE

      - name: "Désinstalleur (choix des données, faux dossier, rien n'est supprimé sur le PC)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-desinstallation.ps1
          exit $LASTEXITCODE

      - name: "Données jamais perdues (fichier abîmé, copie de secours, « Tout restaurer » avec une Aide muette)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-donnees.ps1
          exit $LASTEXITCODE

      - name: "Page RAM (regroupement par appli, étiquettes, alertes, rapport, fausses données)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-memoire.ps1
          exit $LASTEXITCODE

      - name: "Restes de jeux Steam (bibliothèque au nom accentué, fiche verrouillée, fiches relues avant de supprimer, rien de récent supprimé, fausse bibliothèque)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-bibliotheque.ps1
          exit $LASTEXITCODE

      - name: "Sécurité (tâches pas désactivées dites comme telles, jamais « Aucune menace » sans résultat lu, fausses commandes)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-securite.ps1
          exit $LASTEXITCODE

      - name: "Fluidité en partie (écoute de la souris sur son propre fil, Aide qui tient quand ses connexions sont prises, minuteurs qui ne s'empilent plus)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-fluidite.ps1
          exit $LASTEXITCODE

      - name: "Réseau (anciens serveurs plus pingés, box des autres joueurs écartées, suite Mindset non suspecte, trace en veille seulement avec BF6, petits textes)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-reseau.ps1
          exit $LASTEXITCODE

      - name: "Mesure des FPS (jeux à anti-triche EA guettés avant leur lancement, message clair, compteur caché en plein écran exclusif, bulles une à une, longues parties)"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File outils\tester-fps.ps1
          exit $LASTEXITCODE
