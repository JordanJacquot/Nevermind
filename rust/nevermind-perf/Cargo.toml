[package]
name = "nevermind-perf"
version = "0.1.0"
description = "Nevermind en Rust : le bloc « perf » (mesures en direct, page Performances, mode jeu, partie en cours, compteur de FPS, diagnostic)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nevermind-noyau = { path = "../nevermind-noyau" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le module qui parle à Windows (src/windows) : seulement sous Windows. Même version que l'Aide et Mindcare, figée.
# Lectures natives seulement (aucun programme lancé à chaque tour) : temps du processeur (GetSystemTimes), mémoire
# (GlobalMemoryStatusEx), moteurs de la carte graphique (D3DKMTQueryStatistics, ce que lit le Gestionnaire des tâches),
# NVIDIA par nvml.dll de System32 (au lieu de nvidia-smi.exe), disque et vitesse du processeur par PDH.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# L'essai à l'écran du compteur (src/windows/essai_compteur.rs, test ignoré) : le nom du bureau et PrintWindow, pour les
# tests seulement (rien de plus dans le programme livré)
[target.'cfg(windows)'.dev-dependencies.windows]
version = "=0.62.2"
features = ["Win32_Storage_Xps", "Win32_System_StationsAndDesktops"]

[lints]
workspace = true
