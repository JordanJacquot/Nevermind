[package]
name = "nevermind-memoire"
version = "0.1.0"
description = "Nevermind en Rust : le bloc « memoire » (la page RAM : qu'est-ce qui prend ma mémoire ?)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nevermind-noyau = { path = "../nevermind-noyau" }
# La règle « fermable », la même que celle de l'Aide et de NevermindPont.dll
aide-regles = { path = "../aide-regles" }
# Versions figées (« = ») : les mêmes que Mindcare, déjà dans le cache
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
]

[lints]
workspace = true
