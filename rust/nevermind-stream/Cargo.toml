[package]
name = "nevermind-stream"
version = "0.1.0"
description = "Nevermind en Rust : le bloc « stream » (le mode streameur : régler OBS Studio ou Streamlabs Desktop selon la connexion, la carte graphique et la plateforme)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nevermind-noyau = { path = "../nevermind-noyau" }
# Versions figées (« = »), déjà dans le cache (aucun téléchargement). serde : service.json est lu dans une structure qui
# ne garde que la plateforme (la clé de stream n'est jamais lue dans une variable).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le module qui parle à Windows (src/windows) : seulement des lectures, sans droits administrateur (registre en lecture,
# liste des processus et leur chemin, cartes graphiques par DXGI, taille de l'écran). La même version que l'Aide.
[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[lints]
workspace = true
