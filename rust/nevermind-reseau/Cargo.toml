[package]
name = "nevermind-reseau"
version = "0.1.0"
description = "Nevermind en Rust : le bloc « reseau » (scan des appareils, audit de sécurité, connexion, carte bridée)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nevermind-noyau = { path = "../nevermind-noyau" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
regex = "=1.13.1"

# Le module qui parle à Windows (src/windows) : seulement sous Windows, la même version que l'Aide.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
]

# Pas `workspace = true` : le module Windows a besoin d'autoriser le code « unsafe », refusé partout ailleurs (comme
# mindcare-windows).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
