[package]
name = "nevermind-relais"
version = "0.1.0"
description = "Nevermind.exe : le petit relais (comme celui de Mindcare). Il lance Mindset.exe de son dossier avec les mêmes arguments, puis se ferme"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# Nevermind.exe reste pour tout ce qui l'appelle encore (anciennes versions de Mindset, raccourcis, apps.json) :
# contrat-appli, partie 4. Le vrai programme est Mindset.exe (nevermind-appli).
[[bin]]
name = "Nevermind"
path = "src/main.rs"

[dependencies]
# Le message quand Mindset.exe manque (MessageBoxW) : la même version que le reste de la suite, rien de nouveau dans
# Cargo.lock
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(windows)'.dev-dependencies.windows]
version = "=0.62.2"
# (les tests relisent la ligne de commande comme Windows : CommandLineToArgvW)
features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

# Pas `workspace = true` : le message de Windows (src/message.rs) a besoin d'autoriser le code « unsafe », que le
# reste de l'espace de travail interdit tout à fait (forbid). Ici, il est refusé partout (deny), sauf là.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
