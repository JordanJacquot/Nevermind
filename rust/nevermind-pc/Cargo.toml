[package]
name = "nevermind-pc"
version = "0.1.0"
description = "Nevermind en Rust : le bloc « pc » (Ton PC, Tableau de bord, corrections, Tout restaurer, Tests des composants)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nevermind-noyau = { path = "../nevermind-noyau" }
# Les dossiers de Windows que seule l'Aide vide (la même liste que l'Aide)
aide-regles = { path = "../aide-regles" }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_WindowsAndMessaging",
]

# Pas `workspace = true` : le module Windows (src/windows) autorise lui-même le code « unsafe », refusé partout ailleurs.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
